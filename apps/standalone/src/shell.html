<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Mail intake</title>
  <style>
    :root { font-family: Aptos,"Segoe UI",sans-serif; color:#202a32; background:#f4f6f6; font-synthesis:none; --ink:#202a32; --muted:#67747d; --line:#d5dcde; --paper:#fff; --accent:#087f82; --danger:#a53636; --warning:#835c18; --success:#17735f; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100vh; }
    button,input,textarea,select { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible { outline:3px solid rgba(8,127,130,.24); outline-offset:2px; }
    .topbar { height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--line); background:var(--paper); }
    .topbar>div { display:flex; align-items:baseline; gap:10px; }
    .topbar strong { font-size:17px; letter-spacing:-.02em; }
    .topbar span,.queue-bar span { color:var(--muted); font-size:12px; }
    main { width:min(1020px,calc(100% - 32px)); margin:28px auto 72px; }
    .drop { min-height:132px; display:grid; place-content:center; gap:5px; border:1px dashed #9eaeb1; background:#fff; text-align:center; cursor:pointer; transition:border-color .15s,background .15s; }
    .drop:hover,.drop.dragging { border-color:var(--accent); background:#f4fbfa; }
    .drop strong { font-size:16px; }
    .drop span,.empty span { color:var(--muted); font-size:13px; }
    .queue-bar { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:20px; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 3px; font-size:18px; letter-spacing:-.02em; }
    .actions { display:flex; align-items:center; gap:8px; }
    .button { min-height:36px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); padding:7px 13px; color:var(--ink); background:var(--paper); font-weight:650; font-size:13px; text-decoration:none; cursor:pointer; }
    .button:hover { border-color:#aab5b8; }
    .button.primary { border-color:var(--accent); color:#fff; background:var(--accent); }
    .button.danger { color:var(--danger); }
    .button:disabled { opacity:.55; cursor:wait; }
    .records { border-bottom:1px solid var(--line); }
    .record { border-top:1px solid var(--line); background:var(--paper); }
    .record:first-child { border-top:0; }
    .summary { width:100%; min-height:68px; display:grid; grid-template-columns:24px 1fr auto 88px; align-items:center; gap:12px; border:0; padding:10px 16px; color:var(--ink); background:var(--paper); text-align:left; cursor:pointer; }
    .summary:hover { background:#f9fbfb; }
    .expand { color:var(--muted); font-size:20px; font-weight:300; }
    .identity { min-width:0; }
    .identity strong,.identity small,.file-name strong,.file-name small { display:block; }
    .identity strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
    .identity small { margin-top:3px; overflow:hidden; color:var(--muted); text-overflow:ellipsis; white-space:nowrap; }
    .lead-kind { color:var(--muted); font-size:11px; }
    .badge { justify-self:end; color:var(--muted); font-size:10px; font-weight:750; text-transform:uppercase; letter-spacing:.04em; }
    .status-complete .badge { color:var(--success); }
    .status-failed .badge,.status-partial .badge { color:var(--danger); }
    .record-body { padding:18px 52px 24px; border-top:1px solid #e7ebec; }
    .notice { margin:0 0 10px; padding:10px 12px; border-left:3px solid currentColor; background:#faf8f2; color:var(--warning); font-size:13px; }
    .notice.error { background:#fdf5f5; color:var(--danger); }
    .notice a { color:inherit; font-weight:700; }
    .guided-review { display:grid; grid-template-columns:minmax(235px,.72fr) minmax(0,1.28fr); gap:22px; margin:16px 0 22px; padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .guided-details { min-height:230px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:14px; padding-right:22px; border-right:1px solid var(--line); }
    .guided-details .field { width:100%; }
    .guided-details>p { margin:0; color:var(--warning); font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
    .guided-details>p.complete { color:var(--success); }
    .guided-details>strong { font-size:18px; }
    .guided-details>span { color:var(--muted); font-size:12px; line-height:1.5; }
    .email-preview { min-width:0; }
    .email-preview>div { display:grid; gap:4px; margin-bottom:9px; }
    .email-preview>div span { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
    .email-preview>div strong { overflow:hidden; font-size:13px; text-overflow:ellipsis; white-space:nowrap; }
    .email-preview pre { height:220px; margin:0; overflow:auto; padding:13px; border:1px solid var(--line); color:#40484d; background:#f7f8f6; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; margin-top:16px; }
    .field { display:grid; gap:6px; }
    .field.full { grid-column:1/-1; }
    .field>span,.mapping label>span { color:var(--muted); font-size:10px; font-weight:750; text-transform:uppercase; letter-spacing:.04em; }
    input,textarea,select { width:100%; border:1px solid #c8d0d2; border-radius:0; padding:9px 10px; color:var(--ink); background:#fff; }
    textarea { resize:vertical; line-height:1.45; }
    .files { margin-top:24px; }
    .section-line { display:flex; align-items:center; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid var(--line); }
    .section-line strong { font-size:13px; }
    .section-line span { color:var(--muted); font-size:12px; }
    .file-row { min-height:52px; display:grid; grid-template-columns:1fr auto; align-items:center; gap:5px 14px; padding:8px 0; border-bottom:1px solid #ebeeee; }
    .file-name strong { font-size:13px; overflow-wrap:anywhere; }
    .file-name small { margin-top:3px; color:var(--muted); }
    .file-actions { display:flex; align-items:center; gap:10px; }
    .link-button { border:0; padding:4px; color:var(--accent); background:none; font-size:12px; font-weight:700; cursor:pointer; }
    .file-status { min-width:58px; color:var(--muted); font-size:10px; font-weight:750; text-align:right; text-transform:uppercase; }
    .file-status.failed,.file-error { color:var(--danger); }
    .file-status.uploaded { color:var(--success); }
    .file-error { grid-column:1/-1; }
    .record-actions { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:20px; }
    .record-actions>span { overflow:hidden; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .empty { min-height:180px; display:grid; place-content:center; gap:5px; text-align:center; }
    dialog { width:min(680px,calc(100% - 24px)); max-height:calc(100vh - 32px); border:1px solid var(--line); padding:0; color:var(--ink); background:#fff; box-shadow:0 20px 70px rgba(24,35,40,.2); }
    dialog::backdrop { background:rgba(21,30,34,.45); }
    .settings-form { display:grid; gap:16px; padding:22px; }
    .dialog-head { display:flex; align-items:start; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid var(--line); }
    .dialog-head>div { display:grid; gap:3px; }
    .dialog-head>div>strong { font-size:18px; }
    .dialog-head span,.settings-hint { color:var(--muted); font-size:12px; }
    .icon-button { border:0; padding:0 4px; color:var(--muted); background:none; font-size:25px; cursor:pointer; }
    .settings-grid { display:grid; grid-template-columns:1fr 150px; gap:14px; }
    .full-button { width:100%; }
    .board-name { margin:2px 0 -3px; font-size:14px; font-weight:700; }
    .mapping { display:grid; gap:8px; padding-top:4px; }
    .mapping label { display:grid; grid-template-columns:120px 1fr; align-items:center; gap:12px; }
    .settings-hint,.settings-message { margin:0; }
    .settings-message { padding:10px; background:#f4f7f7; font-size:12px; }
    .dialog-actions { display:flex; justify-content:end; gap:8px; padding-top:14px; border-top:1px solid var(--line); }
    .toast { position:fixed; right:18px; bottom:18px; z-index:10; max-width:min(480px,calc(100% - 36px)); display:flex; align-items:start; gap:16px; padding:13px 15px; color:#fff; background:#27333a; box-shadow:0 8px 24px rgba(0,0,0,.18); font-size:13px; }
    .toast button { border:0; padding:0; color:#fff; background:none; font-size:18px; cursor:pointer; }
    #mail-files { display:none; }
    @media (max-width:680px) {
      .topbar { padding:0 16px; }
      main { width:calc(100% - 20px); margin-top:10px; }
      .queue-bar { align-items:flex-start; padding:16px 0; }
      .summary { grid-template-columns:22px 1fr auto; padding:10px; }
      .lead-kind { display:none; }
      .record-body { padding:16px 12px 20px; }
      .fields,.settings-grid,.guided-review { grid-template-columns:1fr; }
      .guided-details { min-height:auto; padding:0 0 18px; border-right:0; border-bottom:1px solid var(--line); }
      .record-actions { align-items:flex-end; }
      .mapping label { grid-template-columns:1fr; gap:5px; }
    }
  </style>
</head>
<body>
  <!-- Optional: fill these values here instead of using Settings. Never commit a real token. -->
  <script>
    window.MAIL_INTAKE_DEFAULTS = {
      bridgeUrl: "",
      bridgeKey: "",
      apiVersion: "2026-04",
      boardId: "",
      groupId: "",
      columns: {
        email: "",
        phone: "",
        address: "",
        message: "",
        submittedAt: "",
        formId: "",
        files: ""
      }
    };
  </script>
  <input id="mail-files" type="file" accept=".eml,.msg,message/rfc822,application/vnd.ms-outlook" multiple>
  <div id="app"></div>
  <!-- Bundles postal-mime (MIT-0) and @kenjiuno/msgreader (Apache-2.0). -->
  <script>/*__APP_BUNDLE__*/</script>
</body>
</html>
